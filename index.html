<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Liquid Glass Clock - A beautiful glassmorphism digital clock showing Indian Standard Time."
  >

  <meta
    name="theme-color"
    content="#050505"
  >

  <title>Liquid Glass Clock</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ==========================================
       BROWSER WARNING
       ========================================== -->

  <div id="browser-warning">
    This clock is optimized for Google Chrome.
  </div>


  <!-- ==========================================
       MAIN CLOCK
       ========================================== -->

  <main class="clock-container">

    <!-- HOURS -->

    <div class="hour-1">
      <div class="glass glass-0"></div>
    </div>

    <div class="hour-2">
      <div class="glass glass-0"></div>
    </div>


    <!-- MINUTES -->

    <div class="minute-1">
      <div class="glass glass-0"></div>
    </div>

    <div class="minute-2">
      <div class="glass glass-0"></div>
    </div>

  </main>


  <!-- ==========================================
       DATE & WEEKDAY
       
       These elements are created automatically
       by main.js.
       ========================================== -->


  <!-- ==========================================
       JAVASCRIPT
       ========================================== -->

  <script src="main.js"></script>

</body>
</html>
